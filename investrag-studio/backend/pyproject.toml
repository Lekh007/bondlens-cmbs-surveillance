[project]
name = "investrag-studio"
version = "0.1.0"
description = "Local-first multi-format document intelligence and RAG evaluation platform"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.5",
    "defusedxml>=0.7.1",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pillow>=11.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.26.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
mypy_path = "src"
packages = ["investrag"]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "investrag"
