name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The whole backend suite is designed to run with no network, no database,
  # no Redis and no GPU. The deterministic provider is what makes that true
  # for the agent tests -- see backend/src/vichara_portfolio/model_gateway.
  MODEL_PROVIDER: deterministic

jobs:
  backend:
    name: backend (ruff / mypy --strict / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --locked --python 3.12

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy --strict)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest -q

  frontend:
    name: frontend (oxlint / vitest / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test -- --run

      - name: Build (tsc -b && vite build)
        run: npm run build

  e2e:
    name: e2e (playwright, route-mocked)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # These specs mock every backend route, so they prove the frontend's own
      # logic -- not the real backend/model integration.
      - name: Run end-to-end specs
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
