[project]
name = "vichara-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lekhraj Kasar", email = "kasarlekhraj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "alembic>=1.19.1",
    "defusedxml>=0.7.1",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-vector-stores-faiss>=0.6.0",
    "lxml>=6.1.2",
    "mlflow>=3.15.2",
    "numpy>=2.5.2",
    "polars>=1.44.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "rq>=2.11.0",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
vichara-portfolio = "vichara_portfolio:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.37.1",
    "locust>=2.46.4",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: hits a real external network dependency (SEC, Ollama); excluded by default",
    "integration: needs a real service (Postgres, Redis); skips itself if unreachable",
]
addopts = "-m 'not live'"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "src"
packages = ["vichara_portfolio"]
python_version = "3.12"
strict = true
ignore_missing_imports = true
