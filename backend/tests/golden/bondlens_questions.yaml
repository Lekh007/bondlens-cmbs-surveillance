# Golden questions for BondLens G1 evaluation (Task 17 reuses these).
# Ground truth pinned from the 2026-08-28 data spike against the real
# May and July 2026 Benchmark 2026-B42 ABS-EE filings.

- id: flagship-status-and-balance
  question: >-
    Which loans changed payment status between May and July, and whose
    balances diverged from schedule?
  expected_tools: [rank_loans_by_status_change, rank_loans_by_balance_drift]
  expected_facts:
    - "loan 30"
    - "Cummins Station"
    - "0"
    - "B"

- id: cured-loans
  question: "Which loans were cured (delinquent then current) between May and July?"
  expected_tools: [rank_loans_by_status_change]
  expected_facts:
    - "loan 16"
    - "loan 39"
    - "PWC Pennant"
    - "325 East 14th Street"

- id: deal-summary
  question: "Give me a deal summary for Benchmark 2026-B42 as of July."
  expected_tools: [get_deal_summary]
  expected_facts:
    - "62"
    - "123"

- id: loan-30-history
  question: "What is the payment history of loan 30 across the periods you have?"
  expected_tools: [get_loan_history]
  expected_facts:
    - "0"
    - "B"

- id: property-noi-honest-negative
  question: >-
    Which properties deteriorated most in net operating income between
    May and July?
  expected_tools: [rank_properties_by_noi_change]
  # Loosened twice after real runs, each time for phrasing, never for
  # substance: (1) the model paraphrased the honest negative result ("no
  # properties deteriorated ... no genuine NOI changes were recorded")
  # instead of the tool's exact reason string; (2) the verified-fallback
  # path (finalize_node echoing evidence verbatim after a repair failure)
  # renders the tool's actual reason string, "...recorded a genuine NOI
  # change...", where "no" and "genuine NOI" are not contiguous - the
  # original fragment "no genuine noi" failed to match despite the answer
  # being fully correct and grounded. "genuine noi change" is a substring
  # of both that reason string and the live paraphrase's "genuine NOI
  # changes" (plural), so it is robust to either path while still
  # requiring the substantive claim.
  expected_facts:
    - "genuine noi change"
    - "deteriorat"
  # This is the flagship negative case (design.md section 0): the correct
  # answer is that there is no property-level deterioration on this deal
  # in this window, not a fabricated ranking.
